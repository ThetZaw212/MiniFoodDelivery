apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: minifood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: minifood/notification:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: minifood-config
            - secretRef:
                name: minifood-secrets
          env:
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: minifood
spec:
  selector:
    app: notification
  ports:
    - name: http
      port: 8080
      targetPort: 8080
