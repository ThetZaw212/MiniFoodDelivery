<section class="mx-auto max-w-6xl px-4 py-10">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <p class="text-sm tracking-[0.22em] uppercase text-[#9f2d2d]">Tonight</p>
      <h1 class="display text-5xl">Choose a restaurant</h1>
    </div>
    <input class="w-full max-w-xs rounded-full border border-stone-300 bg-white px-4 py-2" [value]="query()" (input)="query.set($any($event.target).value)" placeholder="Search cuisine or street" />
  </div>

  @if (error()) {
    <p class="mt-6 text-[#9f2d2d]">{{ error() }}</p>
  }

  <div class="mt-8 grid gap-5 md:grid-cols-2">
    @for (place of visible(); track place.id) {
      <a [routerLink]="['/restaurants', place.id]" class="group block overflow-hidden rounded-3xl bg-white shadow-sm transition hover:-translate-y-1" animate.enter="rise">
        <div class="h-36 bg-gradient-to-br from-[#7a2e2e] via-[#c46b4a] to-[#e6c39a]"></div>
        <div class="flex items-start justify-between gap-3 p-5">
          <div>
            <h2 class="display text-3xl">{{ place.name }}</h2>
            <p class="mt-1 text-stone-600">{{ place.cuisine }} · {{ place.address }}</p>
          </div>
          <p-tag [value]="place.isOpen ? 'Open' : 'Closed'" [severity]="place.isOpen ? 'success' : 'secondary'" />
        </div>
      </a>
    }
  </div>
</section>
